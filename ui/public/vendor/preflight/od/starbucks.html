<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>Starbucks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #f2f0eb; }
</style>
</head>
<body>
<div style="min-height:800px;background:#f2f0eb;color:#1e3932;">
  <div style="background:linear-gradient(120deg,#1e3932 0%, #cba258 100%);color:#fff;padding:28px 32px 36px;">
    <div style="font-size:11px;opacity:0.75;margin-bottom:10px;">Global coffee retail brand. Four-tier green system, warm cream canvas, full-pill buttons.</div>
    <h1 style="font-size:36px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;">Starbucks</h1>
    <p style="font-size:13px;opacity:0.88;max-width:36ch;">电商/营销风：大图促销区 + 商品卡片栅格，和 SaaS 工作台完全不同。</p>
  </div>
  <div style="padding:20px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
    
      <div style="background:#fff;border:1px solid #edebe9;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #1e393210;">
        <div style="height:96px;background:linear-gradient(0deg, #cba258, #edebe9);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">新品上市</div>
          <div style="font-size:18px;font-weight:800;color:#cba258;">¥299</div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #edebe9;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #1e393210;">
        <div style="height:96px;background:linear-gradient(40deg, #cba258cc, #edebe9);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">限时优惠</div>
          <div style="font-size:18px;font-weight:800;color:#cba258;">¥199</div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #edebe9;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #1e393210;">
        <div style="height:96px;background:linear-gradient(80deg, #cba258cc, #edebe9);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">会员专享</div>
          <div style="font-size:18px;font-weight:800;color:#cba258;">¥99</div>
        </div>
      </div>
  </div>
  <div style="margin:0 32px;background:#edebe9;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;">
    <div style="width:80px;height:80px;border-radius:12px;background:#cba258;flex-shrink:0;"></div>
    <div style="flex:1;">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px;">品牌故事 / 转化条</div>
      <div style="font-size:11px;color:#cba258;">双列图文 + 价格 CTA，适合零售与 fintech 落地页。</div>
    </div>
    <span style="background:#cba258;color:#fff;padding:10px 16px;border-radius:10px;font-size:11px;font-weight:600;">立即购买</span>
  </div>
  <div style="display:flex;gap:4px;padding:16px 32px;"><span style="flex:1;height:5px;border-radius:2px;background:#cba258"></span><span style="flex:1;height:5px;border-radius:2px;background:#1e3932"></span><span style="flex:1;height:5px;border-radius:2px;background:#f2f0eb"></span><span style="flex:1;height:5px;border-radius:2px;background:#cba258"></span><span style="flex:1;height:5px;border-radius:2px;background:#edebe9"></span></div>
</div></body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:800px;overflow:hidden;font-family:Inter, system-ui, sans-serif}
  body{background:#fff}
  </style></head><body>
<div style="height:800px;background:#fff;color:#222;padding:24px 32px;">
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <strong style="color:#ff385c;font-size:18px;">Airbnb</strong>
    <div style="flex:1;max-width:320px;margin:0 20px;border:1px solid #ddd;border-radius:999px;padding:10px 16px;font-size:13px;color:#888;">Anywhere · Any week · Add guests</div>
  </header>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
    
      <div style="border-radius:12px;overflow:hidden;">
        <div style="height:140px;background:linear-gradient(120deg,#ff385caa,#ffd7d7);"></div>
        <div style="padding:8px 2px;font-size:12px;font-weight:600;">Lakefront</div>
      </div>
      <div style="border-radius:12px;overflow:hidden;">
        <div style="height:140px;background:linear-gradient(150deg,#ff385caa,#ffd7d7);"></div>
        <div style="padding:8px 2px;font-size:12px;font-weight:600;">Design</div>
      </div>
      <div style="border-radius:12px;overflow:hidden;">
        <div style="height:140px;background:linear-gradient(180deg,#ff385caa,#ffd7d7);"></div>
        <div style="padding:8px 2px;font-size:12px;font-weight:600;">Countryside</div>
      </div>
      <div style="border-radius:12px;overflow:hidden;">
        <div style="height:140px;background:linear-gradient(210deg,#ff385caa,#ffd7d7);"></div>
        <div style="padding:8px 2px;font-size:12px;font-weight:600;">Trending</div>
      </div>
  </div>
</div></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>Mastercard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #f3f0ee; }
</style>
</head>
<body>
<div style="min-height:800px;background:#f3f0ee;color:#141413;">
  <div style="background:linear-gradient(120deg,#141413 0%, #f37338 100%);color:#fff;padding:28px 32px 36px;">
    <div style="font-size:11px;opacity:0.75;margin-bottom:10px;">Global payments network. Warm cream canvas, orbital pill shapes, editorial warmth.</div>
    <h1 style="font-size:36px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;">Mastercard</h1>
    <p style="font-size:13px;opacity:0.88;max-width:36ch;">电商/营销风：大图促销区 + 商品卡片栅格，和 SaaS 工作台完全不同。</p>
  </div>
  <div style="padding:20px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
    
      <div style="background:#fff;border:1px solid #eb001b;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #14141310;">
        <div style="height:96px;background:linear-gradient(0deg, #f37338, #eb001b);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">新品上市</div>
          <div style="font-size:18px;font-weight:800;color:#f37338;">¥299</div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #eb001b;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #14141310;">
        <div style="height:96px;background:linear-gradient(40deg, #f37338cc, #eb001b);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">限时优惠</div>
          <div style="font-size:18px;font-weight:800;color:#f37338;">¥199</div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #eb001b;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #14141310;">
        <div style="height:96px;background:linear-gradient(80deg, #f37338cc, #eb001b);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">会员专享</div>
          <div style="font-size:18px;font-weight:800;color:#f37338;">¥99</div>
        </div>
      </div>
  </div>
  <div style="margin:0 32px;background:#eb001b;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;">
    <div style="width:80px;height:80px;border-radius:12px;background:#f37338;flex-shrink:0;"></div>
    <div style="flex:1;">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px;">品牌故事 / 转化条</div>
      <div style="font-size:11px;color:#f79e1b;">双列图文 + 价格 CTA，适合零售与 fintech 落地页。</div>
    </div>
    <span style="background:#f37338;color:#fff;padding:10px 16px;border-radius:10px;font-size:11px;font-weight:600;">立即购买</span>
  </div>
  <div style="display:flex;gap:4px;padding:16px 32px;"><span style="flex:1;height:5px;border-radius:2px;background:#f37338"></span><span style="flex:1;height:5px;border-radius:2px;background:#141413"></span><span style="flex:1;height:5px;border-radius:2px;background:#f3f0ee"></span><span style="flex:1;height:5px;border-radius:2px;background:#f79e1b"></span><span style="flex:1;height:5px;border-radius:2px;background:#eb001b"></span></div>
</div></body>
</html>

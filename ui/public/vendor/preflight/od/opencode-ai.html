<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>OpenCode</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #201d1d; }
</style>
</head>
<body>
<div style="min-height:800px;background:radial-gradient(circle at 20% 0%, #007aff33 0%, transparent 45%), #201d1d;color:#fdfcfc;padding:24px 28px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
    <strong style="font-size:15px;">OpenCode</strong>
    <span style="font-size:10px;color:#9a9898;border:1px solid #ff3b3066;padding:4px 8px;border-radius:999px;">AI · LLM</span>
  </div>
  <div style="max-width:760px;margin:0 auto;">
    <h1 style="font-size:32px;text-align:center;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;">向 AI 提问，立刻得到答案</h1>
    <div style="background:#ff3b30;border:1px solid #007aff55;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:center;margin-bottom:18px;box-shadow:0 0 0 1px #007aff22, 0 20px 50px #201d1d;">
      <span style="flex:1;font-size:12px;color:#9a9898;">搜索知识库、代码与文档…</span>
      <span style="background:#007aff;color:#fff;padding:8px 14px;border-radius:10px;font-size:11px;font-weight:600;">发送</span>
    </div>
    <div style="display:grid;gap:10px;">
      
        <div style="background:#007aff22;border:1px solid #007aff;border-radius:12px;padding:12px 14px;font-size:11px;color:#fdfcfc;">总结这份报告的核心结论</div>
        <div style="background:#ff3b3088;border:1px solid #9a989833;border-radius:12px;padding:12px 14px;font-size:11px;color:#9a9898;">对比三家竞品定价策略</div>
        <div style="background:#ff3b3088;border:1px solid #9a989833;border-radius:12px;padding:12px 14px;font-size:11px;color:#9a9898;">生成一页路演提纲</div>
    </div>
    <div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div style="background:#ff3b30;border-radius:12px;padding:14px;border:1px solid #9a989833;">
        <div style="font-size:10px;color:#007aff;margin-bottom:8px;">回答片段</div>
        <div style="height:6px;width:92%;background:#9a9898;opacity:0.35;border-radius:3px;margin-bottom:6px;"></div>
        <div style="height:6px;width:78%;background:#9a9898;opacity:0.25;border-radius:3px;"></div>
      </div>
      <div style="background:#ff3b30;border-radius:12px;padding:14px;border:1px solid #9a989833;">
        <div style="font-size:10px;color:#007aff;margin-bottom:8px;">引用来源</div>
        <div style="font-size:10px;color:#9a9898;line-height:1.5;">AI coding platform. Developer-centric dark theme.</div>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:4px;padding-top:18px;"><span style="flex:1;height:5px;border-radius:2px;background:#007aff"></span><span style="flex:1;height:5px;border-radius:2px;background:#201d1d"></span><span style="flex:1;height:5px;border-radius:2px;background:#fdfcfc"></span><span style="flex:1;height:5px;border-radius:2px;background:#9a9898"></span><span style="flex:1;height:5px;border-radius:2px;background:#ff3b30"></span></div>
</div></body>
</html>

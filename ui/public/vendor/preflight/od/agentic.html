<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>Agentic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #f6f6f1; }
</style>
</head>
<body>
<div style="min-height:800px;background:#f6f6f1;color:#111827;">
  <header style="padding:22px 32px;border-bottom:3px solid #111827;display:flex;justify-content:space-between;align-items:baseline;">
    <h1 style="font-size:28px;font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-0.02em;">Agentic</h1>
    <span style="font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#16a34a;">Editorial</span>
  </header>
  <div style="padding:24px 32px;display:grid;grid-template-columns:1.3fr 0.7fr;gap:24px;">
    <article>
      <div style="font-size:11px;color:#ff5701;font-weight:700;margin-bottom:8px;">封面专题</div>
      <h2 style="font-size:34px;line-height:1.08;font-family:Georgia,serif;margin-bottom:12px;">Conversational AI-first interface with minimal controls, clear outcomes, and delegated task flows for agentic workflows.</h2>
      <p style="font-size:13px;line-height:1.7;color:#16a34a;margin-bottom:16px;">大字号导语 + 多栏正文 + 侧边引语，适合品牌叙事、艺术、汽车等风格站。</p>
      <div style="columns:2;gap:18px;font-size:11px;line-height:1.65;color:#16a34a;">
        <p style="margin-bottom:10px;">第一段正文占位，展示分栏阅读体验。</p>
        <p>第二段正文占位，强调 editorial 与其他模板的差异。</p>
      </div>
    </article>
    <aside>
      <div style="height:200px;background:linear-gradient(180deg,#ff5701,#111827);border-radius:4px;margin-bottom:14px;"></div>
      <div style="border-left:4px solid #ff5701;padding-left:12px;font-family:Georgia,serif;font-size:16px;line-height:1.4;color:#111827;">“引语块让气质立刻不同。”</div>
    </aside>
  </div>
  <div style="display:flex;gap:4px;padding:0 32px 16px;"><span style="flex:1;height:5px;border-radius:2px;background:#ff5701"></span><span style="flex:1;height:5px;border-radius:2px;background:#111827"></span><span style="flex:1;height:5px;border-radius:2px;background:#f6f6f1"></span><span style="flex:1;height:5px;border-radius:2px;background:#16a34a"></span><span style="flex:1;height:5px;border-radius:2px;background:#d97706"></span></div>
</div></body>
</html>

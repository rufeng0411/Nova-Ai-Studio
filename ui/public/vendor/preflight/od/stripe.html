<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:800px;overflow:hidden;font-family:Inter, system-ui, sans-serif}
  body{background:#fff}
  </style></head><body>
<div style="height:800px;background:#fff;color:#061b31;position:relative;overflow:hidden;">
  <div style="position:absolute;inset:-20% -10% auto auto;width:520px;height:520px;background:radial-gradient(circle, #ffffff55 0%, transparent 68%);filter:blur(8px);"></div>
  <header style="display:flex;justify-content:space-between;align-items:center;padding:18px 40px;position:relative;">
    <strong style="font-size:15px;font-weight:400;letter-spacing:-0.02em;">Stripe</strong>
    <nav style="display:flex;gap:18px;font-size:12px;color:#f96bee;"><span>Products</span><span>Solutions</span><span>Pricing</span></nav>
  </header>
  <section style="padding:48px 40px 32px;max-width:640px;position:relative;">
    <h1 style="font-size:52px;font-weight:300;letter-spacing:-0.04em;line-height:1.04;margin-bottom:16px;">Financial infrastructure<br/>to grow your revenue</h1>
    <p style="font-size:16px;font-weight:300;line-height:1.5;color:#f96bee;margin-bottom:24px;">Light sohne-style headlines, navy text, signature purple CTAs and blue-tinted shadows.</p>
    <span style="display:inline-block;background:#ffffff;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;box-shadow:0 18px 40px rgba(50,50,93,.25);">Start now</span>
  </section>
  <div style="margin:0 40px;background:#fff;border-radius:10px;border:1px solid #e5edf5;box-shadow:0 30px 60px rgba(50,50,93,.18);padding:20px;height:320px;display:grid;grid-template-columns:1.1fr 1fr;gap:16px;">
    <div style="background:linear-gradient(135deg,#ffffff18,#f6f9fc);border-radius:8px;padding:16px;"><div style="font-size:11px;color:#f96bee;margin-bottom:8px;">Payments</div><div style="font-size:28px;font-weight:300;letter-spacing:-0.03em;">$24,580.00</div></div>
    <div style="display:grid;grid-template-rows:1fr 1fr;gap:10px;"><div style="background:#f6f9fc;border-radius:8px;"></div><div style="background:#f6f9fc;border-radius:8px;"></div></div>
  </div>
</div></body></html>

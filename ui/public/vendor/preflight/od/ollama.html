<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>Ollama</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #000000; }
</style>
</head>
<body>
<div style="min-height:800px;background:radial-gradient(circle at 20% 0%, #00000033 0%, transparent 45%), #000000;color:#ffffff;padding:24px 28px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
    <strong style="font-size:15px;">Ollama</strong>
    <span style="font-size:10px;color:#737373;border:1px solid #26262666;padding:4px 8px;border-radius:999px;">AI · LLM</span>
  </div>
  <div style="max-width:760px;margin:0 auto;">
    <h1 style="font-size:32px;text-align:center;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;">向 AI 提问，立刻得到答案</h1>
    <div style="background:#262626;border:1px solid #00000055;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:center;margin-bottom:18px;box-shadow:0 0 0 1px #00000022, 0 20px 50px #000000;">
      <span style="flex:1;font-size:12px;color:#737373;">搜索知识库、代码与文档…</span>
      <span style="background:#000000;color:#fff;padding:8px 14px;border-radius:10px;font-size:11px;font-weight:600;">发送</span>
    </div>
    <div style="display:grid;gap:10px;">
      
        <div style="background:#00000022;border:1px solid #000000;border-radius:12px;padding:12px 14px;font-size:11px;color:#ffffff;">总结这份报告的核心结论</div>
        <div style="background:#26262688;border:1px solid #73737333;border-radius:12px;padding:12px 14px;font-size:11px;color:#737373;">对比三家竞品定价策略</div>
        <div style="background:#26262688;border:1px solid #73737333;border-radius:12px;padding:12px 14px;font-size:11px;color:#737373;">生成一页路演提纲</div>
    </div>
    <div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div style="background:#262626;border-radius:12px;padding:14px;border:1px solid #73737333;">
        <div style="font-size:10px;color:#000000;margin-bottom:8px;">回答片段</div>
        <div style="height:6px;width:92%;background:#737373;opacity:0.35;border-radius:3px;margin-bottom:6px;"></div>
        <div style="height:6px;width:78%;background:#737373;opacity:0.25;border-radius:3px;"></div>
      </div>
      <div style="background:#262626;border-radius:12px;padding:14px;border:1px solid #73737333;">
        <div style="font-size:10px;color:#000000;margin-bottom:8px;">引用来源</div>
        <div style="font-size:10px;color:#737373;line-height:1.5;">Run LLMs locally. Terminal-first, monochrome simplicity.</div>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:4px;padding-top:18px;"><span style="flex:1;height:5px;border-radius:2px;background:#000000"></span><span style="flex:1;height:5px;border-radius:2px;background:#000000"></span><span style="flex:1;height:5px;border-radius:2px;background:#ffffff"></span><span style="flex:1;height:5px;border-radius:2px;background:#737373"></span><span style="flex:1;height:5px;border-radius:2px;background:#262626"></span></div>
</div></body>
</html>

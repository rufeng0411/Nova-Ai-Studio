<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:800px;overflow:hidden;font-family:Inter, system-ui, sans-serif}
  body{background:#171717}
  </style></head><body>
<div style="height:800px;background:#171717;color:#ededed;padding:28px 36px;">
  <header style="display:flex;justify-content:space-between;margin-bottom:32px;"><strong>Supabase</strong><span style="color:#0f0f0f;font-size:12px;">Postgres platform</span></header>
  <h1 style="font-size:42px;font-weight:700;letter-spacing:-0.04em;margin-bottom:12px;">Build in a weekend.<br/>Scale to millions.</h1>
  <p style="color:#9ca3af;font-size:14px;max-width:40ch;line-height:1.55;margin-bottom:22px;">Dark dev UI with emerald accent — auth, database, storage, edge functions.</p>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;">
    <div style="background:#242424;border:1px solid #333;border-radius:10px;padding:14px;font-size:12px;"><div style="width:8px;height:8px;border-radius:50%;background:#0f0f0f;margin-bottom:8px;"></div>Database</div><div style="background:#242424;border:1px solid #333;border-radius:10px;padding:14px;font-size:12px;"><div style="width:8px;height:8px;border-radius:50%;background:#0f0f0f;margin-bottom:8px;"></div>Auth</div><div style="background:#242424;border:1px solid #333;border-radius:10px;padding:14px;font-size:12px;"><div style="width:8px;height:8px;border-radius:50%;background:#0f0f0f;margin-bottom:8px;"></div>Storage</div><div style="background:#242424;border:1px solid #333;border-radius:10px;padding:14px;font-size:12px;"><div style="width:8px;height:8px;border-radius:50%;background:#0f0f0f;margin-bottom:8px;"></div>Edge</div>
  </div>
  <div style="background:#121212;border:1px solid #2a2a2a;border-radius:12px;padding:14px;height:340px;font-family:ui-monospace,monospace;font-size:11px;color:#8f8f8f;">
    <span style="color:#0f0f0f;">select</span> * <span style="color:#79b8ff;">from</span> projects <span style="color:#79b8ff;">where</span> active = true;
  </div>
</div></body></html>

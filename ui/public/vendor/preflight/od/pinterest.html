<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>Pinterest</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #e5e5e0; }
</style>
</head>
<body>
<div style="min-height:800px;background:#e5e5e0;color:#211922;">
  <div style="background:linear-gradient(120deg,#211922 0%, #91918c 100%);color:#fff;padding:28px 32px 36px;">
    <div style="font-size:11px;opacity:0.75;margin-bottom:10px;">Visual discovery. Red accent, masonry grid, image-first.</div>
    <h1 style="font-size:36px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;">Pinterest</h1>
    <p style="font-size:13px;opacity:0.88;max-width:36ch;">电商/营销风：大图促销区 + 商品卡片栅格，和 SaaS 工作台完全不同。</p>
  </div>
  <div style="padding:20px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
    
      <div style="background:#fff;border:1px solid #e60023;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #21192210;">
        <div style="height:96px;background:linear-gradient(0deg, #91918c, #e60023);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">新品上市</div>
          <div style="font-size:18px;font-weight:800;color:#91918c;">¥299</div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #e60023;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #21192210;">
        <div style="height:96px;background:linear-gradient(40deg, #91918ccc, #e60023);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">限时优惠</div>
          <div style="font-size:18px;font-weight:800;color:#91918c;">¥199</div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #e60023;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #21192210;">
        <div style="height:96px;background:linear-gradient(80deg, #91918ccc, #e60023);"></div>
        <div style="padding:12px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:4px;">会员专享</div>
          <div style="font-size:18px;font-weight:800;color:#91918c;">¥99</div>
        </div>
      </div>
  </div>
  <div style="margin:0 32px;background:#e60023;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;">
    <div style="width:80px;height:80px;border-radius:12px;background:#91918c;flex-shrink:0;"></div>
    <div style="flex:1;">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px;">品牌故事 / 转化条</div>
      <div style="font-size:11px;color:#62625b;">双列图文 + 价格 CTA，适合零售与 fintech 落地页。</div>
    </div>
    <span style="background:#91918c;color:#fff;padding:10px 16px;border-radius:10px;font-size:11px;font-weight:600;">立即购买</span>
  </div>
  <div style="display:flex;gap:4px;padding:16px 32px;"><span style="flex:1;height:5px;border-radius:2px;background:#91918c"></span><span style="flex:1;height:5px;border-radius:2px;background:#211922"></span><span style="flex:1;height:5px;border-radius:2px;background:#e5e5e0"></span><span style="flex:1;height:5px;border-radius:2px;background:#62625b"></span><span style="flex:1;height:5px;border-radius:2px;background:#e60023"></span></div>
</div></body>
</html>

<!DOCTYPE html>

<head>

<body>
<div style="min-height:800px;background:#1b1938;color:#e9e5dd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">

    <main style="padding:16px;">
      <div style="background:#000;border:1px solid #292827;border-radius:10px;padding:14px;font-size:11px;line-height:1.6;">
        <div style="color:#cbb7fb;">import</div> <span style="color:#e9e5dd;">{ createClient }</span> <span style="color:#714cb6;">from</span> <span style="color:#a5d6ff;">'@sdk/core'</span><br/><br/>
        <span style="color:#714cb6;">// Fast email client. Premium dark UI, keyboard-first, purple glow.</span><br/>
        <span style="color:#c586c0;">const</span> client = <span style="color:#dcdcaa;">createClient</span>({ apiKey: <span style="color:#ce9178;">'…'</span> })
      </div>
      <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:Inter,sans-serif;">
        <div style="background:#292827;border-radius:10px;padding:12px;font-size:10px;">API 参考</div>
        <div style="background:#292827;border-radius:10px;padding:12px;font-size:10px;">CLI 指南</div>
      </div>
    </main>
  </div>
  <div style="display:flex;gap:4px;padding:10px 18px;font-family:Inter,sans-serif;"><span style="flex:1;height:5px;border-radius:2px;background:#cbb7fb"></span><span style="flex:1;height:5px;border-radius:2px;background:#1b1938"></span><span style="flex:1;height:5px;border-radius:2px;background:#e9e5dd"></span><span style="flex:1;height:5px;border-radius:2px;background:#714cb6"></span><span style="flex:1;height:5px;border-radius:2px;background:#292827"></span></div>

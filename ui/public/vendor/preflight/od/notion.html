<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:800px;overflow:hidden;font-family:Inter, system-ui, sans-serif}
  body{background:#31302e}
  </style></head><body>
<div style="height:800px;background:#31302e;color:#f6f5f4;display:grid;grid-template-columns:220px 1fr;">
  <aside style="padding:16px 12px;border-right:1px solid #ececea;font-size:12px;color:#615d59;">
    <div style="font-weight:600;color:#f6f5f4;margin-bottom:14px;">Notion workspace</div>
    <div style="padding:5px 8px;border-radius:4px;margin-bottom:2px;">Getting started</div><div style="padding:5px 8px;border-radius:4px;margin-bottom:2px;">Roadmap</div><div style="padding:5px 8px;border-radius:4px;margin-bottom:2px;">Tasks</div><div style="padding:5px 8px;border-radius:4px;margin-bottom:2px;">Wiki</div>
  </aside>
  <main style="padding:56px 80px 40px;">
    <div style="font-size:12px;color:#615d59;margin-bottom:8px;">Product spec</div>
    <h1 style="font-size:40px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;">Build a calm, block-based workspace</h1>
    <div style="border-left:3px solid #ececea;padding-left:14px;margin-bottom:14px;color:#615d59;font-size:14px;line-height:1.6;">Notion-like soft neutrals, editorial blocks, generous whitespace.</div>
    <div style="display:grid;gap:8px;margin-top:20px;">
      
        <div style="display:flex;gap:8px;align-items:center;font-size:14px;"><span style="width:14px;height:14px;border:1.5px solid #615d59;border-radius:3px;display:inline-block;"></span>Goals for Q3</div>
        <div style="display:flex;gap:8px;align-items:center;font-size:14px;"><span style="width:14px;height:14px;border:1.5px solid #615d59;border-radius:3px;display:inline-block;"></span>Launch checklist</div>
        <div style="display:flex;gap:8px;align-items:center;font-size:14px;"><span style="width:14px;height:14px;border:1.5px solid #615d59;border-radius:3px;display:inline-block;"></span>Customer feedback</div>
    </div>
  </main>
</div></body></html>

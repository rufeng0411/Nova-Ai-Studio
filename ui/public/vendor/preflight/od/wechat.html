<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>WeChat Design System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #1a1a1a; }
</style>
</head>
<body>
<div style="min-height:800px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:420px;min-height:620px;background:linear-gradient(165deg,#07c160 0%, #1a1a1a 55%, #059050 100%);border-radius:18px;padding:28px 24px;color:#fff;box-shadow:0 30px 80px #0008;display:flex;flex-direction:column;justify-content:space-between;">
    <div>
      <div style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.8;margin-bottom:16px;">Poster · Social</div>
      <h1 style="font-size:34px;line-height:1.05;font-weight:900;letter-spacing:-0.03em;margin-bottom:12px;">WeChat Design System</h1>
      <p style="font-size:13px;line-height:1.55;opacity:0.88;">Brand visual language for WeChat Mini Programs, official accounts, and open ecosystem extensions.</p>
    </div>
    <div style="background:#fff2;border-radius:14px;padding:16px;backdrop-filter:blur(8px);">
      <div style="font-size:22px;font-weight:800;margin-bottom:6px;">NEW</div>
      <div style="font-size:11px;opacity:0.85;">扫码了解更多 · 限时活动</div>
    </div>
  </div>
  <div style="position:absolute;bottom:12px;left:24px;right:24px;display:flex;gap:4px;"><span style="flex:1;height:5px;border-radius:2px;background:#07c160"></span><span style="flex:1;height:5px;border-radius:2px;background:#1a1a1a"></span><span style="flex:1;height:5px;border-radius:2px;background:#ffffff"></span><span style="flex:1;height:5px;border-radius:2px;background:#10b160"></span><span style="flex:1;height:5px;border-radius:2px;background:#059050"></span></div>
</div></body>
</html>

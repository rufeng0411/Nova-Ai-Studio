    <main style="padding:16px;">

        <div style="background:#b0b4ba;border-radius:10px;padding:12px;font-size:10px;">API 参考</div>
        <div style="background:#b0b4ba;border-radius:10px;padding:12px;font-size:10px;">CLI 指南</div>
      </div>
    </main>
  </div>
  <div style="display:flex;gap:4px;padding:10px 18px;font-family:Inter,sans-serif;"><span style="flex:1;height:5px;border-radius:2px;background:#000000"></span><span style="flex:1;height:5px;border-radius:2px;background:#000000"></span><span style="flex:1;height:5px;border-radius:2px;background:#f0f0f3"></span><span style="flex:1;height:5px;border-radius:2px;background:#60646c"></span><span style="flex:1;height:5px;border-radius:2px;background:#b0b4ba"></span></div>

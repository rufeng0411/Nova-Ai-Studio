<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>粗野主义</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #fff; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#fff;padding:28px 32px;color:#ffffff;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">编辑 / 出版 · brutalist</div>
  <h1 style="font-family:Inter,sans-serif;font-size:42px;font-weight:900;letter-spacing:0.06em;margin-bottom:18px;text-transform:uppercase;">BRUTAL</h1>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:520px;">
    
        <div style="background:#d4d4d4;border:4px solid #ffffff;border-radius:0;padding:16px;">
          <div style="height:120px;background:#000000;opacity:0.5;margin-bottom:12px;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 1</div>
        </div>
        <div style="background:#d4d4d4;border:4px solid #ffffff;border-radius:0;padding:16px;">
          <div style="height:120px;background:#000000;opacity:0.65;margin-bottom:12px;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 2</div>
        </div>
        <div style="background:#d4d4d4;border:4px solid #ffffff;border-radius:0;padding:16px;">
          <div style="height:120px;background:#000000;opacity:0.8;margin-bottom:12px;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 3</div>
        </div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#000000"></span><span style="flex:1;height:5px;border-radius:2px;background:#ffffff"></span><span style="flex:1;height:5px;border-radius:2px;background:#facc15"></span><span style="flex:1;height:5px;border-radius:2px;background:#525252"></span><span style="flex:1;height:5px;border-radius:2px;background:#d4d4d4"></span></div>
</div></body>
</html>

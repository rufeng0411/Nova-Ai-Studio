<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>深色科技</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #22d3ee; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#22d3ee;padding:28px 32px;color:#e2e8f0;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">企业 / 产品 · dark-tech</div>
  <h1 style="font-family:Inter,sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;text-transform:none;">深色科技</h1>
  <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:16px;height:520px;">
    
        <div style="background:#475569;border-radius:14px;padding:18px;border:1px solid #1e293b33;">
          <div style="font-size:13px;line-height:1.6;opacity:0.85;">深色科技 风格预览：版式、字体与装饰语言与极简 wireframe 不同。</div>
          <div style="margin-top:16px;height:8px;width:70%;background:#0b1220;border-radius:4px;"></div>
        </div>
        <div style="background:linear-gradient(180deg,#0b1220,#e2e8f0);border-radius:14px;"></div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#0b1220"></span><span style="flex:1;height:5px;border-radius:2px;background:#e2e8f0"></span><span style="flex:1;height:5px;border-radius:2px;background:#22d3ee"></span><span style="flex:1;height:5px;border-radius:2px;background:#1e293b"></span><span style="flex:1;height:5px;border-radius:2px;background:#475569"></span></div>
</div></body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>剪纸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #ea580c; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#ea580c;padding:28px 32px;color:#fff7ed;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">表现 / 印刷 · paper-cut</div>
  <h1 style="font-family:Inter,sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;text-transform:none;">剪纸</h1>
  <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:16px;height:520px;">
    
        <div style="background:#fb923c;border-radius:14px;padding:18px;border:1px solid #fed7aa33;">
          <div style="font-size:13px;line-height:1.6;opacity:0.85;">剪纸 风格预览：版式、字体与装饰语言与极简 wireframe 不同。</div>
          <div style="margin-top:16px;height:8px;width:70%;background:#422006;border-radius:4px;"></div>
        </div>
        <div style="background:linear-gradient(180deg,#422006,#fff7ed);border-radius:14px;"></div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#422006"></span><span style="flex:1;height:5px;border-radius:2px;background:#fff7ed"></span><span style="flex:1;height:5px;border-radius:2px;background:#ea580c"></span><span style="flex:1;height:5px;border-radius:2px;background:#fed7aa"></span><span style="flex:1;height:5px;border-radius:2px;background:#fb923c"></span></div>
</div></body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>瑞士极简</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #2563eb; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#2563eb;padding:28px 32px;color:#f5f5f5;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">企业 / 产品 · swiss-minimal</div>
  <h1 style="font-family:Inter,sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;text-transform:none;">SWISS</h1>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:520px;">
    
        <div style="background:#737373;border:1px solid #e5e5e533;border-radius:12px;padding:16px;">
          <div style="height:120px;background:#111111;opacity:0.5;margin-bottom:12px;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 1</div>
        </div>
        <div style="background:#737373;border:1px solid #e5e5e533;border-radius:12px;padding:16px;">
          <div style="height:120px;background:#111111;opacity:0.65;margin-bottom:12px;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 2</div>
        </div>
        <div style="background:#737373;border:1px solid #e5e5e533;border-radius:12px;padding:16px;">
          <div style="height:120px;background:#111111;opacity:0.8;margin-bottom:12px;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 3</div>
        </div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#111111"></span><span style="flex:1;height:5px;border-radius:2px;background:#f5f5f5"></span><span style="flex:1;height:5px;border-radius:2px;background:#2563eb"></span><span style="flex:1;height:5px;border-radius:2px;background:#e5e5e5"></span><span style="flex:1;height:5px;border-radius:2px;background:#737373"></span></div>
</div></body>
</html>

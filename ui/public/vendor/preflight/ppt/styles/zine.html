<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>小刊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #ef4444; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#ef4444;padding:28px 32px;color:#fef08a;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">表现 / 印刷 · zine</div>
  <h1 style="font-family:Inter,sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;text-transform:none;">小刊</h1>
  <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:16px;height:520px;">
    
        <div style="background:#78716c;border-radius:14px;padding:18px;border:1px solid #d6d3d133;">
          <div style="font-size:13px;line-height:1.6;opacity:0.85;">小刊 风格预览：版式、字体与装饰语言与极简 wireframe 不同。</div>
          <div style="margin-top:16px;height:8px;width:70%;background:#1c1917;border-radius:4px;"></div>
        </div>
        <div style="background:linear-gradient(180deg,#1c1917,#fef08a);border-radius:14px;"></div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#1c1917"></span><span style="flex:1;height:5px;border-radius:2px;background:#fef08a"></span><span style="flex:1;height:5px;border-radius:2px;background:#ef4444"></span><span style="flex:1;height:5px;border-radius:2px;background:#d6d3d1"></span><span style="flex:1;height:5px;border-radius:2px;background:#78716c"></span></div>
</div></body>
</html>

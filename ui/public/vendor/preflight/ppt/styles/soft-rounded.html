<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>柔和圆角</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #6366f1; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#6366f1;padding:28px 32px;color:#f8fafc;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">企业 / 产品 · soft-rounded</div>
  <h1 style="font-family:Inter,sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;text-transform:none;">柔和圆角</h1>
  <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:16px;height:520px;">
    
        <div style="background:#94a3b8;border-radius:14px;padding:18px;border:1px solid #e2e8f033;">
          <div style="font-size:13px;line-height:1.6;opacity:0.85;">柔和圆角 风格预览：版式、字体与装饰语言与极简 wireframe 不同。</div>
          <div style="margin-top:16px;height:8px;width:70%;background:#1e293b;border-radius:4px;"></div>
        </div>
        <div style="background:linear-gradient(180deg,#1e293b,#f8fafc);border-radius:14px;"></div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#1e293b"></span><span style="flex:1;height:5px;border-radius:2px;background:#f8fafc"></span><span style="flex:1;height:5px;border-radius:2px;background:#6366f1"></span><span style="flex:1;height:5px;border-radius:2px;background:#e2e8f0"></span><span style="flex:1;height:5px;border-radius:2px;background:#94a3b8"></span></div>
</div></body>

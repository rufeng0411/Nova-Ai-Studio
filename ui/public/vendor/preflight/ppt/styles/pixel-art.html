<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>像素风</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #c4b5fd; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#c4b5fd;padding:28px 32px;color:#c4b5fd;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">特殊风格 · pixel-art</div>
  <h1 style="font-family:Inter,sans-serif;font-size:42px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;text-transform:none;">PIXEL</h1>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:520px;">
    
        <div style="background:#1e1b4b;border:1px solid #312e8133;border-radius:12px;padding:16px;">
          <div style="height:120px;background:#1e1b4b;opacity:0.5;margin-bottom:12px;image-rendering:pixelated;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 1</div>
        </div>
        <div style="background:#1e1b4b;border:1px solid #312e8133;border-radius:12px;padding:16px;">
          <div style="height:120px;background:#1e1b4b;opacity:0.65;margin-bottom:12px;image-rendering:pixelated;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 2</div>
        </div>
        <div style="background:#1e1b4b;border:1px solid #312e8133;border-radius:12px;padding:16px;">
          <div style="height:120px;background:#1e1b4b;opacity:0.8;margin-bottom:12px;image-rendering:pixelated;"></div>
          <div style="font-size:12px;font-weight:700;">幻灯 3</div>
        </div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#1e1b4b"></span><span style="flex:1;height:5px;border-radius:2px;background:#c4b5fd"></span><span style="flex:1;height:5px;border-radius:2px;background:#22c55e"></span><span style="flex:1;height:5px;border-radius:2px;background:#312e81"></span><span style="flex:1;height:5px;border-radius:2px;background:#a78bfa"></span></div>
</div></body>
</html>

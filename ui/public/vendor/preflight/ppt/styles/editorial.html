<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>编辑出版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #b45309; }
</style>
</head>
<body>
<div style="width:1280px;height:720px;background:#b45309;padding:28px 32px;color:#f7f2ea;">
  <div style="font-size:10px;opacity:0.65;margin-bottom:8px;">编辑 / 出版 · editorial</div>
  <h1 style="font-family:Georgia,serif;font-size:42px;font-weight:700;letter-spacing:-0.03em;margin-bottom:18px;text-transform:none;">编辑出版</h1>
  <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:16px;height:520px;">
    
        <div style="background:#78716c;border-radius:14px;padding:18px;border:1px solid #e7ddd033;">
          <div style="font-size:13px;line-height:1.6;opacity:0.85;">编辑出版 风格预览：版式、字体与装饰语言与极简 wireframe 不同。</div>
          <div style="margin-top:16px;height:8px;width:70%;background:#1a1510;border-radius:4px;"></div>
        </div>
        <div style="background:linear-gradient(180deg,#1a1510,#f7f2ea);border-radius:14px;"></div>
  </div>
  <div style="display:flex;gap:4px;margin-top:14px;"><span style="flex:1;height:5px;border-radius:2px;background:#1a1510"></span><span style="flex:1;height:5px;border-radius:2px;background:#f7f2ea"></span><span style="flex:1;height:5px;border-radius:2px;background:#b45309"></span><span style="flex:1;height:5px;border-radius:2px;background:#e7ddd0"></span><span style="flex:1;height:5px;border-radius:2px;background:#78716c"></span></div>
</div></body>
</html>
